services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: express-api-dev
    ports:
      - "5000:5000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
